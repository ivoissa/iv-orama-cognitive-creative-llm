# IV-ORAMA French NLP — configuration candidate 1.5.0
# Tous les paramètres sont explicites et indépendants, sauf priorités documentées.
# Sans argument : false lance le texte ci-dessous, true lance le banc avec le fournisseur configuré.
benchmark_enabled: false
default_sentence: |-
  Hier soir, Marie observait un ciel bleu.
  Elle écrivait quelques lignes dans son carnet.

transformations:
  direct_dictionary: true
  # En Lite : taux d’application des substitutions validées. Avec DISCO : liberté sémantique.
  adjective_semantic_freedom: 100
  noun_semantic_freedom: 100
  emphase_mode: true
  # Adjectif éditorial utilisé lorsque le dictionnaire ne fournit pas un ajout validé.
  noun_emphasis: "remarquable:apres"
  emphasis_fallback_limit: 1
  yoda_mode_enabled: true
  move_circumstantial_complements_enabled: true
  add_commas_around_complements_enabled: true
  replace_adjectives_with_synonyms_enabled: true
  replace_first_and_third_nouns_enabled: true
  stoic_mode_enabled: false
  random_seed: 20261107
  synonym_register:
    # Priorité historique : courant > soutenu > familier.
    familiar_enabled: false
    common_enabled: true
    formal_enabled: false

synonyms:
  candidate_rejections_enabled: false
  disco:
    enabled: false
    directory: "data/disco/fr-general-20151126-lm-sim"
    min_group_score: 0.01
    min_margin: 0.02
    min_retention: 0.8
  robert:
    require_reviewed_source: true
    fallback_to_omw: false
    enabled: true
    context_weight: 1
    neighborhood_weight: 1
    min_context: 0.01
    min_margin: 0.01
  enabled: true
  # Ordre : cache -> OMW français (WOLF/WordNet) -> TSV -> JWI optionnel -> WOLF XML.
  ranking:
    semantic_weight: 0.8
    agreement_weight: 0.2
  wolf:
    # WOLF XML embarqué dans le JAR, aucune installation externe.
    enabled: true
  jwi:
    # Nécessite un dictionnaire WordNet externe compatible.
    enabled: false
    dictionary_directory: "data/wordnet-fr/dict"
  fallback_to_wolf_when_jwi_has_no_result: true
  cache:
    read_enabled: false
    write_enabled: false
    file_path: "data/synonyms-cache.tsv"

# Assistant Cognitive (Ollama local)
llm:
  provider: ollama
  api_key_env: OPENAI_API_KEY
  endpoint: "http://127.0.0.1:11434"
  model: "qwen3.5:4b-q4_K_M"
  timeout_seconds: 300
  context_tokens: 4096
  output_tokens: 768
  temperature: 0.2
  threads: 8
  memory_messages: 17
  gpu_layers: 0

security:
  mode: ENFORCE
  max_input_chars: 32768
  max_output_chars: 65536
  protected_values_file: ""

tools:
  wikipedia_enabled: false

# La section transformations règle le style du rendu Lite.
rendering:
  enabled: false
